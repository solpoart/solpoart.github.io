        <p>SOL 是拉丁語系裡的太陽、法文裡孕育萬物的土壤；<br>PO 是拍打著島嶼邊緣的海波。</p>
        <p>如同破曉時分，晨光從山巒稜線延伸至海岸，<br>太陽、土地與海洋，構成了「曉山波」。</p>
        <p><strong>曉山波</strong>是一間跨領域創意設計所，專注於知識、文化與視覺的整合傳達，將專業知識轉化為清晰易懂、富有感受力的設計，讓值得被認識的內容被理解與看見。</p>
        <p>以好奇探索，以設計回應，從知曉開始，連結人與世界。</p>
