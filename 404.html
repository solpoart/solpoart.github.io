  <!-- 404 頁可能出現在任何網址層級，所以樣式與 logo 都內嵌，不依賴相對路徑 -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .page-404{min-height:100vh;min-height:100svh;position:relative;overflow:hidden;
      background:radial-gradient(120% 120% at 0% 0%,#eaf5f9 0%,#bad5e0 100%);
      display:flex;align-items:center;justify-content:center}
    .page-404::before{content:'';position:absolute;inset:0;background:rgba(128,168,188,.4)}
    .page-404::after{content:'';position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .4 0 0 0 0 .45 0 0 0 1.6 -1.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
    .logo-404{position:absolute;top:60px;left:100px;z-index:1}
    .logo-404 img{display:block;width:200px;height:95px;object-fit:contain}
    .msg-404{position:relative;z-index:1;padding:0 24px}
    .msg-404 h1{font-family:'Chonburi',serif;font-weight:400;font-size:80px;line-height:1.2;color:#24303c}
    .msg-404 p{font-weight:500;font-size:24px;line-height:36px;color:#797a7b}
    .sns-404{display:flex;gap:16px;margin-top:32px}
    .sns-404 a{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.55);color:#24303c;transition:background .2s,color .2s,transform .2s}
    .sns-404 svg{width:24px;height:24px;fill:currentColor}
    .sns-404 a:focus-visible{outline:3px solid #80a8bc;outline-offset:3px}
    .sns-404 a:active{transform:scale(.94)}
    @media (hover:hover){.sns-404 a:hover{background:#fff;color:#4b768f}}
    @media (max-width:600px){
      .logo-404{top:24px;left:16px}.logo-404 img{width:140px;height:66px}
      .msg-404 h1{font-size:64px}.msg-404 p{font-size:18px;line-height:30px}
    }
  </style>
